<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlowGuide</title>
<meta name="description" content="GlowGuide: makeup and skincare matched to your skin, and to what you already own.">
<meta name="theme-color" content="#FBA1B7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette: one hue (pink, base #FBA1B7) in five steps, plus a plum-black for text. Nothing else.
   Layout: familiar retail shell. Phones get bottom tabs, laptops get a top nav. Content never exceeds 1280px. */
:root{
  --base:#FBA1B7; --sun:#FFDBAA; --paper:#FFF0F5; --card:#FFFFFF; --blush:#FFE6EC; --tint:#FFD1DA;
  --brand:#C2456A; --brand-deep:#8E2B4B; --brand-soft:#FFDDE4; --ink:#3A1824; --muted:#80606A; --line:#F7D3DB;
  --on:#FFFFFF; --plum:#4A1B2A; --plum-ink:#FFE9EE;
  --good:#2E7656; --good-soft:#E2F2EA; --bad:#B3261E; --bad-soft:#FCE4E2;
  --tab:var(--brand); --tab-soft:var(--brand-soft);
  --display:'Fraunces',Georgia,serif; --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif; --hand:'Caveat','Bradley Hand',cursive; --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --r:16px; --e1:0 1px 2px rgba(90,25,65,.06),0 6px 14px -6px rgba(90,25,65,.12); --e2:0 2px 4px rgba(90,25,65,.06),0 18px 30px -14px rgba(90,25,65,.28);
  --fs:100%; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1C0F18; --card:#2A1722; --blush:#34202B; --tint:#4A2A3D; --ink:#FCEBF4; --muted:#CDAABD; --line:#472A3B;
  --brand:#FBA1B7; --brand-deep:#F58AA6; --brand-soft:#44213A; --on:#3A1824; --plum:#120A10; --plum-ink:#FFE9EE;
  --good:#6FD0A4; --good-soft:#173A2C; --bad:#FF8A80; --bad-soft:#40201E;
  --e1:0 1px 2px rgba(0,0,0,.4),0 6px 14px -6px rgba(0,0,0,.5); --e2:0 2px 4px rgba(0,0,0,.4),0 18px 30px -14px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#1C0F18; --card:#2A1722; --blush:#34202B; --tint:#4A2A3D; --ink:#FCEBF4; --muted:#CDAABD; --line:#472A3B;
  --brand:#FBA1B7; --brand-deep:#F58AA6; --brand-soft:#44213A; --on:#3A1824; --plum:#120A10; --plum-ink:#FFE9EE;
  --good:#6FD0A4; --good-soft:#173A2C; --bad:#FF8A80; --bad-soft:#40201E;
  --e1:0 1px 2px rgba(0,0,0,.4),0 6px 14px -6px rgba(0,0,0,.5); --e2:0 2px 4px rgba(0,0,0,.4),0 18px 30px -14px rgba(0,0,0,.7); color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs);scroll-behavior:smooth}
html[data-size="sm"]{--fs:93%} html[data-size="lg"]{--fs:118%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.14;margin:0;text-wrap:balance;letter-spacing:-.012em}
h1{font-size:clamp(1.75rem,4.6vw,2.6rem)} h2{font-size:clamp(1.25rem,3vw,1.6rem)} h3{font-size:1.04rem}
p{margin:0} a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.mono{font-family:var(--mono)}
.hand{font-family:var(--hand);font-weight:700;font-size:1.35rem;line-height:1.1;color:var(--brand)}
svg.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic.fill{fill:currentColor}
[hidden]{display:none!important}
.eyebrow{font:700 .74rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}

/* top: announcement, header, menu */
.announce{display:block;background:var(--plum);color:var(--plum-ink);font:500 .82rem var(--body);text-align:center;padding:8px 12px;text-decoration:none}
.announce:hover{text-decoration:underline}
.hdr{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-main{max-width:1280px;margin:0 auto;padding:8px 16px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"logo . icons" "search search search";align-items:center;gap:6px 12px}
.logo{font:500 1.6rem var(--display);color:var(--ink);text-decoration:none;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:8px}
.logo em{font-style:italic;color:var(--brand)}
.logo .mk{width:30px;height:30px;border-radius:10px;background:var(--base);display:grid;place-items:center;color:var(--brand-deep);box-shadow:var(--e1)}
.logo .mk svg{width:18px;height:18px}
.searchbar{grid-area:search;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:999px;background:var(--blush);border:1.5px solid transparent;color:var(--muted);text-align:left;width:100%}
.searchbar:hover{border-color:var(--base)}
.icons{grid-area:icons;display:flex;gap:2px;align-items:center}
.hico{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink);text-decoration:none;background:none;border:0}
.hico:hover{background:var(--blush)}
.cnt{position:absolute;top:5px;right:3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--brand);color:var(--on);font:700 .68rem var(--body);display:grid;place-items:center}
.menu-wrap{position:relative}
.hav{width:42px;height:42px;border-radius:50%;background:var(--base);color:var(--plum);display:grid;place-items:center;font:700 1.05rem var(--display);border:0;box-shadow:var(--e1)}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--e2);padding:8px;z-index:40}
.menu .who{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block;font-family:var(--display);font-size:1.05rem}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:none;text-decoration:none;font-weight:600;text-align:left}
.menu a:hover,.menu button:hover{background:var(--blush)}
.menu .out{color:var(--bad)}
.hnav{display:none}
@media (min-width:960px){
  .hdr-main{grid-template-columns:auto minmax(280px,520px) 1fr;grid-template-areas:"logo search icons";gap:32px}
  .hnav{display:flex;gap:2px;max-width:1280px;margin:0 auto;padding:0 12px}
  .hnav a{padding:11px 18px;text-decoration:none;font-weight:600;font-size:.94rem;color:var(--muted);border-bottom:3px solid transparent}
  .hnav a:hover{color:var(--ink)}
  .hnav a[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}
}
.btabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.btabs a{display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:center;min-height:54px;font-size:.72rem;font-weight:600;text-decoration:none;color:var(--muted);border-radius:12px}
.btabs a[aria-current="page"]{color:var(--brand)}
.btabs a[aria-current="page"] svg{stroke-width:2.6}
@media (min-width:960px){.btabs{display:none}}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
@media (min-width:640px){.wrap{padding-left:24px;padding-right:24px}}
@media (min-width:960px){.wrap{padding:28px 28px 64px}}
.foot{background:var(--plum);color:var(--plum-ink);padding:30px 16px calc(100px + env(safe-area-inset-bottom));font-size:.9rem}
.foot>div{max-width:1280px;margin:0 auto;display:grid;gap:12px}
@media (min-width:960px){.foot{padding:36px 28px}}

/* controls: tactile buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:0;background:var(--brand);color:var(--on);font-weight:700;text-decoration:none;box-shadow:0 2px 0 var(--brand-deep),0 10px 18px -10px var(--brand);transition:transform .1s,box-shadow .1s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--brand-deep),0 4px 8px -6px var(--brand)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--line)}
.btn.sec:hover{box-shadow:inset 0 0 0 1.5px var(--brand);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand);padding:0 12px;box-shadow:none}
.btn.ghost:hover{background:var(--blush)}
.btn.soft{background:var(--base);color:var(--plum);box-shadow:0 2px 0 #E9839F,0 10px 18px -10px #E9839F}
.btn.sm{min-height:40px;padding:0 16px;font-size:.9rem}
.btn.lg{min-height:56px;font-size:1.05rem;padding:0 28px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}.stack.sm{gap:8px}
.between{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;display:inline-flex;align-items:center;gap:6px;font-size:.92rem}
.chip:hover{border-color:var(--base);background:var(--blush)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on);border-color:var(--brand)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}.scroller .chip{flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.74rem;background:var(--brand-soft);color:var(--brand)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.dark{background:var(--plum);color:var(--plum-ink)}.pill.sun{background:var(--sun);color:var(--plum)}
.field{display:flex;flex-direction:column;gap:6px}.field label,.label{font-weight:700;font-size:.92rem}
input[type=text],input[type=email],input[type=password],textarea{width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
textarea{resize:vertical;min-height:84px}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--brand-soft);border-radius:999px;padding:4px;gap:4px}
.seg button{min-height:40px;padding:0 18px;border:0;background:transparent;border-radius:999px;font-weight:700;color:var(--muted);display:inline-flex;gap:6px;align-items:center;justify-content:center}
.seg button[aria-selected="true"]{background:var(--card);color:var(--brand);box-shadow:var(--e1)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:34px 0 14px}
.sh h2{position:relative;padding-bottom:8px}
.sh h2::after{content:"";position:absolute;left:0;bottom:0;width:36px;height:3px;border-radius:3px;background:var(--base)}
.sh button.lnk{font-weight:700;font-size:.9rem;color:var(--brand);background:none;border:0;padding:0;min-height:32px}
.sh button.lnk:hover{text-decoration:underline}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--e1)}
.meter{height:8px;border-radius:99px;background:var(--brand-soft);overflow:hidden}.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph p{color:var(--muted);margin-top:4px;max-width:60ch}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 6px;margin:0 0 8px -6px;border-radius:999px;border:0;background:none;color:var(--muted);font-weight:600;text-decoration:none}
.back:hover{background:var(--blush);color:var(--brand)}

/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.streak{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--sun);color:var(--plum);font-weight:700;font-size:.88rem}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media (min-width:720px){.qa{grid-template-columns:repeat(4,1fr)}}
.qa a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-weight:700;box-shadow:var(--e1);min-height:64px;transition:transform .15s,box-shadow .15s}
.qa a:hover{transform:translateY(-2px);box-shadow:var(--e2)}
.qa .i{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.qa small{display:block;color:var(--muted);font-weight:500;font-size:.78rem;line-height:1.2}
.banners{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:24px}
.banners::-webkit-scrollbar{display:none}
@media (min-width:960px){.banners{grid-auto-columns:calc(50% - 7px)}}
.banner{scroll-snap-align:start;border-radius:24px;padding:28px;min-height:240px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;text-decoration:none;overflow:hidden;position:relative;box-shadow:var(--e2)}
.banner::before{content:"";position:absolute;right:-60px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.14)}
.banner>*{position:relative}
.banner h2{font-size:clamp(1.5rem,4vw,2.05rem);color:inherit;max-width:12ch}
.banner p{opacity:.92;max-width:28ch;margin:8px 0 16px}
.banner .art{display:flex;align-items:flex-end}
.banner .art svg{height:158px;width:auto;margin-left:-26px;filter:drop-shadow(0 12px 10px rgba(50,10,35,.28))}
.banner .art svg:first-child{margin-left:0}
@media (max-width:640px){.banner{grid-template-columns:1fr;min-height:0;padding:22px;gap:14px}.banner h2{max-width:none}.banner p{max-width:none;margin:6px 0 12px}.banner .art{justify-content:flex-end}.banner .art svg{height:88px;margin-left:-14px}}
.catrow{display:grid;grid-auto-flow:column;grid-auto-columns:80px;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
@media (min-width:960px){.catrow{grid-auto-columns:100px;gap:22px}}
.catbtn{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:.84rem;text-align:center}
.catbtn .circ{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--blush);border:2px solid var(--card);box-shadow:var(--e1);transition:transform .15s,box-shadow .15s}
.catbtn:hover .circ{transform:translateY(-4px);box-shadow:var(--e2)}
.catbtn svg{height:50px;width:auto}
@media (min-width:960px){.catbtn .circ{width:90px;height:90px}.catbtn svg{height:64px}}
.hrail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,180px);gap:12px;overflow-x:auto;padding:4px 4px 16px;margin:0 -4px;scroll-snap-type:x proximity;scrollbar-width:thin}
.hrail>*{scroll-snap-align:start}
@media (min-width:960px){.hrail{grid-auto-columns:minmax(210px,230px);gap:18px}}
.today{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:18px;border-radius:22px;background:var(--base);color:var(--plum);border:0;box-shadow:var(--e2);margin-top:22px}
.today .btn{background:var(--plum);color:var(--plum-ink);box-shadow:0 2px 0 #000}
.today p{color:var(--plum);opacity:.8}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--brand-deep) calc(var(--v)*1%),rgba(255,255,255,.55) 0);display:grid;place-items:center;position:relative;font:700 .95rem var(--display)}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card);color:var(--ink)}.ring b{position:relative;color:var(--ink)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.trust div{display:flex;flex-direction:column;gap:2px;font-size:.88rem;color:var(--muted)}.trust b{color:var(--ink);font-family:var(--display);font-size:1rem}
@media (max-width:640px){.trust{grid-template-columns:1fr;gap:12px}}

/* product tile */
.pc{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--e1);transition:transform .18s,box-shadow .18s}
.pc:hover{transform:translateY(-3px);box-shadow:var(--e2)}
.pc-img{display:grid;place-items:center;aspect-ratio:1/1;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--t) 14%,#fff) 0,color-mix(in srgb,var(--t) 22%,var(--blush)) 100%);border:0;padding:14px 20%;width:100%}
.pc-img svg,.pdp-img svg,.lrow .im svg,.sk-pick .im svg,.mini .im svg,.sitem svg{filter:drop-shadow(0 6px 5px rgba(80,20,60,.2))}
.pc-img svg{height:100%;width:auto;max-width:100%}
.pc-tags{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.heart{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--card) 90%,transparent);display:grid;place-items:center;color:var(--muted);box-shadow:var(--e1)}
.heart[aria-pressed="true"]{color:var(--brand)}
.pc-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.pc-brand{font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pc-name{background:none;border:0;padding:0;text-align:left;font-weight:600;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em}
.pc-shade{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block;flex:none}
.pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;gap:6px}
.price{font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.addk{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:none;font-weight:700;font-size:.8rem;display:inline-flex;align-items:center;gap:4px}
.addk:hover{border-color:var(--brand);color:var(--brand)}
.addk.on{background:var(--good-soft);color:var(--good);border-color:transparent}

/* shop */
.shopgrid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.shopgrid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media (min-width:1100px){.shopgrid{grid-template-columns:repeat(4,1fr);gap:20px}}
@media (min-width:1500px){.shopgrid{grid-template-columns:repeat(5,1fr)}}
.shop{display:block}.filters{display:none}
@media (min-width:960px){.shop{display:grid;grid-template-columns:230px 1fr;gap:32px;align-items:start}.filters{display:flex;flex-direction:column;gap:20px;position:sticky;top:150px;max-height:calc(100vh - 170px);overflow:auto;padding-right:6px}.fbtn{display:none!important}}
.flist{display:flex;flex-direction:column;gap:2px}
.flist button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.flist button:hover{background:var(--blush)}

function labOf(r, g, b) {

function shopList() {

}

function searchRes(q) {

  const lks = LOOKS.filter(L => terms.every(t => (L.name + ' ' + L.keys.join(' ') + ' ' + L.occ.join(' ') + ' ' + L.style).toLowerCase().includes(t))).slice(0, 4);

    pref() { S.prefs[d.k] = d.v === 'true' ? true : d.v === 'false' ? false : d.v; save(); applyPrefs(); if (d.k === 'voice') ui.voice = S.prefs.voice; render(); },
    prefReset() { S.prefs = Object.assign({}, DEF_PREFS); save(); applyPrefs(); render(); toast('Display and behaviour settings reset to defaults'); },
    install() { try { ui.installEvt.prompt(); } catch (x) { } },
    redoSelfie() { startOb(1, true); },
    qpick() { ui.q = d.v; render(); const q = $('#q'); q && q.focus(); },
    logout() { logout(); }, login() { login(); },
    demo() { seedDemo(); ui.ob = null; goReplace(S.prefs.start || 'home'); toast('Demo profile loaded with a sample Beauty Bag'); },
    newProfile() {
      if (!S.profile) { startOb2(); go('setup-0'); return; }
      dialog('Start a new profile?', '<p class="muted">This removes the saved profile, Beauty Bag, wishlist and routine history from this device. You can export a backup first from Profile and settings after you sign in.</p>', '<button class="btn danger" type="button" data-act="doNew">Remove and start new</button><button class="btn sec" type="button" data-act="closeSheet">Keep my profile</button>');
    },
    doNew() { closeSheet(false, () => { wipe(); startOb2(); go('setup-0'); }); },
    deleteAcct() { dialog('Delete your account?', '<p class="muted">This clears your profile, Beauty Bag, wishlist, saved looks and routine history from this device. It cannot be undone, so export a backup first if you might want it back.</p>', '<button class="btn danger" type="button" data-act="doDelete">Delete everything</button><button class="btn sec" type="button" data-act="closeSheet">Cancel</button>'); },
    doDelete() { closeSheet(false, () => { if (cloudOn()) { cloudDelete(); return; } wipe(); goReplace('welcome'); toast('Account deleted from this device'); }); },
    authOpen() { authSheet(d.m || 'in'); }, authSwitch() { authSheet(d.m || 'in'); }, doAuth() { doAuth(); }, syncNow() { pushAll().then(ok => toast(ok ? 'Synced' : 'Could not sync. Check your connection.')); },
    exportData() { openSheet(`<h2>Back up your data</h2><p class="muted" style="margin:8px 0 12px">Copy this text and keep it somewhere safe. Paste it into Restore on any device to bring your profile back.</p><label class="sr" for="exp">Backup text</label><textarea id="exp" class="mono" readonly>${esc(exportJSON())}</textarea><div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="copyData">Copy to clipboard</button><button class="btn sec" type="button" data-act="closeSheet">Done</button></div>`); const x = $('#exp'); x && x.select(); },
    copyData() { const x = $('#exp'); x.select(); try { navigator.clipboard.writeText(x.value).then(() => toast('Backup copied'), () => { document.execCommand('copy'); toast('Backup copied'); }); } catch (er) { try { document.execCommand('copy'); toast('Backup copied'); } catch (e2) { toast('Press Ctrl+C or long-press to copy'); } } },
    importData() { openSheet(`<h2>Restore from backup</h2><p class="muted" style="margin:8px 0 12px">Paste the backup text here. This replaces what is saved on this device.</p><label class="sr" for="imp">Backup text</label><textarea id="imp" class="mono" placeholder="Paste backup text"></textarea><p id="impErr" class="small" style="color:var(--bad);margin-top:6px" role="alert"></p><div class="row" style="margin-top:8px"><button class="btn" type="button" data-act="doImport">Restore</button><button class="btn sec" type="button" data-act="closeSheet">Cancel</button></div>`); },
    doImport() {
      try {
        const j = JSON.parse(($('#imp') || {}).value || ''); if (j.app !== 'glowguide' || !j.profile) throw 0;
        closeSheet(false, () => { const pr = S.prefs; S = Object.assign(blank(), { profile: j.profile, bag: j.bag || [], wish: j.wish || [], favs: j.favs || [], rt: j.rt || {}, level: j.level || 'basic', hist: j.hist || [], prefs: Object.assign({}, DEF_PREFS, j.prefs || pr), session: true }); save(); applyPrefs(); goReplace('home'); toast('Backup restored'); });
      } catch (er) { const m = $('#impErr'); if (m) m.textContent = 'That does not look like a GlowGuide backup. Copy the full text and try again.'; }
    },
    obNext() { if (o.step === 0) { o.name = ($('#obName') || {}).value || o.name; if (!o.name.trim()) o.name = 'You'; } go('setup-' + (o.step + 1)); },
    obSkipPhoto() { o.est = null; o.photo = null; o.confirm = 'edit'; go('setup-2'); },
    obConfirm() { go('setup-3'); }, obChange() { o.confirm = 'edit'; render(); },
    obUnder() { o.under = d.v; render(); }, obDepth() { o.depth = +d.v; render(); },
    obSkin() { o.skin = d.v; render(); setTimeout(() => { if (R.name === 'setup' && o.step === 3) go('setup-4'); }, 220); },
    obFinish() { o.finish = d.v; render(); }, obBudget() { o.budget = BUDGETS[+d.v].v; render(); },
    obMulti() { const arr = o[d.k], i = arr.indexOf(d.v); i < 0 ? arr.push(d.v) : arr.splice(i, 1); render(); },
    obDone() {
      S.profile = { name: o.name || 'You', under: o.under, depth: o.depth, skin: o.skin || 'normal', finish: o.finish, budget: o.budget, brands: o.brands, sens: o.sens, concerns: o.concerns }; S.session = true; save();
      const ed = o.edit; ui.ob = null; goReplace(ed ? 'profile' : (S.prefs.start || 'home')); toast(ed ? 'Profile updated' : 'Your Beauty Profile is ready');
    }
  };
  if (A[a]) { if (t.tagName === 'A') e.preventDefault(); A[a](); }
});
document.addEventListener('submit', e => { if (e.target.id === 'authForm') { e.preventDefault(); doAuth(); } });
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.in) return;
  if (t.dataset.in === 'obName') ui.ob.name = t.value; else if (t.dataset.in === 'vibe') { ui.text = t.value; S.draft = t.value; save(); }
  else if (t.dataset.in === 'pfName') { S.profile.name = t.value.trim() || 'You'; save(); const h = $('.hav'); if (h) h.textContent = (S.profile.name[0] || 'G').toUpperCase(); }
  else if (t.dataset.in === 'q') { ui.q = t.value; $('#sres').innerHTML = searchRes(ui.q); }
  else if (t.dataset.in === 'bagQ') { ui.bagQ = t.value; const pos = t.selectionStart; $('.sheet').innerHTML = '<div class="grab"></div>' + bagPicker(); const n = $('#bagQ'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => { const t = e.target; if (t.type !== 'file' || !t.files[0]) return; const f = t.files[0]; t.value = ''; if (t.dataset.in === 'selfie') H.obSelfie(f); else if (t.dataset.in === 'inspo') H.inspo(f); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.sheet')) { closeSheet(); return; } if (ui.menu) { ui.menu = false; renderChrome(route()); const b = $('.hav'); b && b.focus(); return; } }
  if (route() === 'tutorial' && S.tut && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !$('.sheet')) { if (e.key === 'ArrowRight') goStep(1); if (e.key === 'ArrowLeft') goStep(-1); }
  if (e.key === 'Enter' && e.target.id === 'obName') { e.preventDefault(); ui.ob.name = e.target.value || 'You'; go('setup-1'); }
});
let tx = null, ty = null;
document.addEventListener('touchstart', e => { if (e.target.closest('[data-swipe]')) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } else tx = null; }, { passive: true });
document.addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) goStep(dx < 0 ? 1 : -1); }, { passive: true });

window.addEventListener('scroll', () => { scrollMap[curHash] = window.scrollY; }, { passive: true });
window.addEventListener('popstate', () => {
  popped = true; setTimeout(() => { popped = false; }, 80);
  if ($('.sheet')) closeSheet(true);
  const f = afterPop; afterPop = null; if (f) setTimeout(f, 0);
});
window.addEventListener('hashchange', () => {
  const wasTut = R.name === 'tutorial'; ui.menu = false;
  if (popped) ui.nav = Math.max(0, ui.nav - 1); else ui.nav++;
  const prevKey = curHash; curHash = location.hash;
  if (!/^#tutorial-/.test(curHash) && wasTut) clearTimer();
  if (sheetPushed && !$('.sheet')) sheetPushed = false;
  refresh();
  window.scrollTo(0, popped ? (scrollMap[curHash] || 0) : 0);
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.installEvt = e; });
applyPrefs();
render();
cloudInit();
try { if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { }

</script>
